name: Render Video

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify start
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESP=$(curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT" \
            --data-urlencode "text=⏳ رندر شروع شد: آماده‌سازی و نصب پکیج‌ها…")
          echo "MSG_ID=$(echo "$RESP" | jq -r '.result.message_id')" >> "$GITHUB_ENV"

      - name: Apply uploaded zip files
        run: |
          if ls uploads/*.zip >/dev/null 2>&1; then
            for z in uploads/*.zip; do
              unzip -o "$z" -x ".github/*"
              rm "$z"
            done
            git config user.name "motion-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -m "apply uploaded zip" || true
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install browser
        run: npx remotion browser ensure

      - name: Render
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG_ID: ${{ env.MSG_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run render 2>&1 | tee render.log

      - name: Send to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CAP="$(cat out/caption.txt 2>/dev/null || echo 'رندر تموم شد ✅')"
          SIZE=$(stat -c%s out/video.mp4)
          if [ "$SIZE" -gt 49000000 ]; then
            MSG=$(printf '%s\n%s' "$CAP" "ویدیو بیشتر از ۵۰ مگ شد. از تب Actions بخش Artifacts دانلودش کن.")
            curl -sS -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT" \
              --data-urlencode "text=$MSG"
          else
            curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TOKEN/sendVideo" \
              -F chat_id="$CHAT" \
              -F video=@out/video.mp4 \
              -F supports_streaming=true \
              -F caption="$CAP"
          fi

      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          { echo "❌ رندر خطا داد. آخرین خط‌های لاگ:"; tail -n 20 render.log 2>/dev/null; } | head -c 3500 > err.txt
          curl -sS -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT" \
            --data-urlencode "text@err.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 1
