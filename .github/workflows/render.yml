name: Render Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply uploaded zip files
        run: |
          if ls uploads/*.zip >/dev/null 2>&1; then
            for z in uploads/*.zip; do
              unzip -o "$z" -x ".github/*"
              rm "$z"
            done
            git config user.name "motion-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -m "apply uploaded zip" || true
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install browser
        run: npx remotion browser ensure

      - name: Render
        run: npm run render

      - name: Send to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SIZE=$(stat -c%s out/video.mp4)
          if [ "$SIZE" -gt 49000000 ]; then
            curl -sS "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT" \
              -d text="ویدیو بیشتر از ۵۰ مگ شد. از تب Actions بخش Artifacts دانلودش کن."
          else
            curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendVideo" \
              -F chat_id="$CHAT" \
              -F video=@out/video.mp4 \
              -F supports_streaming=true \
              -F caption="رندر تموم شد ✅"
          fi

      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT" \
            -d text="❌ رندر خطا داد. لاگ رو توی تب Actions ببین."

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 7
