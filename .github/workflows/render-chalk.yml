# render-chalk.yml  VERSION v6 (live progress message + library: engine/chalk/lib + episodes/<ep>/ in the PRIVATE repo motion-assets)
name: Render Chalk

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder in the private repo: episodes/<ep>/ needs scenes.js, timing.json, mix.m4a"
        default: "ep1v2"
      start:
        description: "Start second (0 = from the beginning)"
        default: "0"
      seconds:
        description: "How many seconds to render (0 = until the end)"
        default: "0"
      audio:
        description: "mix = add the episode audio, none = silent preview with no subtitles"
        default: "mix"
        type: choice
        options: ["mix", "none"]
      scale:
        description: "Output width: 1080 (final) or 720 (fast preview)"
        default: "1080"
        type: choice
        options: ["1080", "720"]
      crf:
        description: "x264 quality (lower = better and bigger, 24 = current)"
        default: "24"
      shards:
        description: "Parallel jobs"
        default: "6"
      deliver:
        description: "tg = Telegram (max 49 MB) | release = master in private GitHub release + preview in Telegram | split = 45 MB parts in Telegram"
        default: "tg"
        type: choice
        options: ["tg", "release", "split"]

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
    steps:
      - name: Live progress message in Telegram (edits one message)
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.parse
          TOKEN = os.environ["TOKEN"]; CHAT = os.environ["CHAT"]; GH = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]; RUN = os.environ["RUN_ID"]
          FA = str.maketrans("0123456789", "۰۱۲۳۴۵۶۷۸۹")
          def tg(method, **kw):
              req = urllib.request.Request("https://api.telegram.org/bot%s/%s" % (TOKEN, method), data=urllib.parse.urlencode(kw).encode())
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)
          def jobs():
              req = urllib.request.Request("https://api.github.com/repos/%s/actions/runs/%s/jobs?per_page=50" % (REPO, RUN),
                                           headers={"Authorization": "Bearer " + GH, "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)["jobs"]
          def frac(j):
              if j["status"] == "completed":
                  return 1.0
              st = j.get("steps") or []
              return sum(1 for s in st if s["status"] == "completed") / len(st) if st else 0.0
          def fa(n): return str(n).translate(FA)
          def clock(s): return fa(int(s // 60)) + ":" + fa("%02d" % int(s % 60))
          LAST_STEP = {"Install tools": "آماده‌سازی نهایی", "Decrypt, join, add audio": "چسباندن تکه‌ها و صدا", "Deliver": "ارسال ویدیو"}
          def build(js, t0, head):
              plan = [j for j in js if j["name"] == "plan"]
              shards = [j for j in js if j["name"].startswith("shard")]
              fin = [j for j in js if j["name"] == "finish"]
              p = 0.05 * (frac(plan[0]) if plan else 0)
              if shards: p += 0.75 * sum(frac(j) for j in shards) / len(shards)
              if fin: p += 0.20 * frac(fin[0])
              p = min(100, int(p * 100))
              done = sum(1 for j in shards if j["status"] == "completed")
              if fin and fin[0]["status"] == "in_progress":
                  cur = [s["name"] for s in (fin[0].get("steps") or []) if s["status"] == "in_progress"]
                  stage = LAST_STEP.get(cur[0], "مرحله‌ی آخر") if cur else "مرحله‌ی آخر"
              elif shards:
                  stage = "رندر موازی: %s از %s شارد" % (fa(done), fa(len(shards)))
              else:
                  stage = "آماده‌سازی"
              bar = "█" * (p // 10) + "░" * (10 - p // 10)
              return "%s\n%s %s٪\n%s\n⏱ %s" % (head, bar, fa(p), stage, clock(time.time() - t0)), p
          def run():
              t0 = time.time()
              head = "🎬 رندر مرد گچی"
              mid = tg("sendMessage", chat_id=CHAT, text=head + "\n░░░░░░░░░░ ۰٪\nشروع شد…")["result"]["message_id"]
              last, last_t = "", 0.0
              while time.time() - t0 < 40 * 60:
                  try:
                      js = jobs()
                  except Exception:
                      time.sleep(8); continue
                  core = [j for j in js if j["name"] in ("plan", "finish") or j["name"].startswith("shard")]
                  bad = [j for j in core if j.get("conclusion") in ("failure", "cancelled")]
                  fin = [j for j in js if j["name"] == "finish"]
                  text, p = build(js, t0, head)
                  if bad:
                      cancelled = any(j.get("conclusion") == "cancelled" for j in bad)
                      text = ("⛔ رندر لغو شد" if cancelled else "❌ رندر خطا خورد") + "\n⏱ " + clock(time.time() - t0)
                  elif fin and fin[0]["status"] == "completed" and fin[0].get("conclusion") == "success":
                      text = "✅ رندر تموم شد، ویدیو فرستاده شد\n██████████ ۱۰۰٪\n⏱ " + clock(time.time() - t0)
                  if text != last and time.time() - last_t >= 4:
                      try:
                          tg("editMessageText", chat_id=CHAT, message_id=mid, text=text)
                      except Exception:
                          pass
                      last, last_t = text, time.time()
                  if bad or (fin and fin[0]["status"] == "completed"):
                      return
                  time.sleep(6)
          try:
              run()
          except Exception:
              pass
          PY

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - name: Get private engine and assets
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/motion-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: priv
          persist-credentials: false
      - id: p
        working-directory: priv/engine/chalk
        run: |
          echo "matrix=$(python3 plan.py '${{ inputs.shards }}' '${{ inputs.start }}' '${{ inputs.seconds }}' '${{ inputs.episode }}')" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Get private engine and assets
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/motion-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: priv
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build page
        working-directory: priv/engine/chalk
        run: python3 build_html.py ${{ inputs.episode }}
      - name: Render shard
        working-directory: priv/engine/chalk
        env:
          SCALE: ${{ inputs.scale }}
          NOSUBS: ${{ inputs.audio == 'none' && '1' || '0' }}
          MAXRATE: ${{ inputs.deliver == 'release' && '40M' || '9M' }}
        run: python3 render_shard.py ${{ matrix.s }} ${{ matrix.e }} /tmp/chunk.mp4 "${{ inputs.deliver == 'release' && '16' || inputs.crf }}"
      - name: Encrypt chunk (repo is public; artifacts are not private)
        env:
          K: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: openssl enc -aes-256-cbc -pbkdf2 -pass env:K -in /tmp/chunk.mp4 -out /tmp/chunk_${{ matrix.i }}.enc
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: /tmp/chunk_${{ matrix.i }}.enc
          retention-days: 1

  finish:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg p7zip-full
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/chunks
      - name: Get private engine and assets
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/motion-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: priv
          persist-credentials: false
      - name: Decrypt, join, add audio
        env:
          K: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e
          cd /tmp/chunks
          : > list.txt
          for f in $(ls chunk-*/chunk_*.enc | sort -V); do
            n=$(basename "$f" .enc)
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in "$f" -out "$n.mp4"
            echo "file '$n.mp4'" >> list.txt
          done
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy joined.mp4
          if [ "${{ inputs.audio }}" = "none" ]; then
            cp joined.mp4 /tmp/master.mp4
          else
            EP="$GITHUB_WORKSPACE/priv/episodes/${{ inputs.episode }}"
            if [ -f "$EP/mix.m4a" ]; then
              ffmpeg -y -loglevel error -i joined.mp4 -i "$EP/mix.m4a" -map 0:v -map 1:a -c copy -shortest -movflags +faststart /tmp/master.mp4
            else
              ffmpeg -y -loglevel error -i joined.mp4 -i "$EP/mix.wav" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart /tmp/master.mp4
            fi
          fi
          ls -la /tmp/master.mp4
      - name: Deliver
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.ASSETS_WRITE_TOKEN }}
          DELIVER: ${{ inputs.deliver }}
          EP: ${{ inputs.episode }}
          CRF: ${{ inputs.crf }}
          SCALE: ${{ inputs.scale }}
          OWNER: ${{ github.repository_owner }}
          RUN_N: ${{ github.run_number }}
        run: |
          set -e
          LIMIT=49000000
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/master.mp4 | cut -d. -f1)
          MB=$(( $(stat -c%s /tmp/master.mp4) / 1048576 ))
          tg_msg() { curl -sS "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT" --data-urlencode "text=$1" > /dev/null; }
          tg_video() { curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendVideo" -F chat_id="$CHAT" -F video=@"$1" -F supports_streaming=true -F caption="$2" > /dev/null; }
          case "$DELIVER" in
            tg)
              if [ "$(stat -c%s /tmp/master.mp4)" -gt "$LIMIT" ]; then
                tg_msg "رندر تموم شد ولی ${MB} مگابایته و تلگرام بالای ۵۰ نمیذاره. دوباره با master یا split بزن."
              else
                tg_video /tmp/master.mp4 "رندر مرد گچی ✅ (${DUR} ثانیه · ${SCALE}p · crf ${CRF} · ${MB} MB)"
              fi
              ;;
            release)
              C="$CRF"
              for i in 1 2 3; do
                ffmpeg -y -loglevel error -i /tmp/master.mp4 -c:v libx264 -preset veryfast -crf "$C" -maxrate 9M -bufsize 18M -pix_fmt yuv420p -colorspace bt709 -color_primaries bt709 -color_trc bt709 -c:a copy -movflags +faststart /tmp/preview.mp4
                [ "$(stat -c%s /tmp/preview.mp4)" -le "$LIMIT" ] && break
                C=$((C+3))
              done
              TAG="${EP}-r${RUN_N}"
              NOTE="مستر آپلود نشد (سکرت ASSETS_WRITE_TOKEN تنظیم نشده)."
              if [ -n "$GH_TOKEN" ]; then
                cp /tmp/master.mp4 "/tmp/${EP}_master.mp4"
                if gh release create "$TAG" "/tmp/${EP}_master.mp4" --repo "$OWNER/motion-assets" --title "$EP master (run $RUN_N)" --notes "Master render, ${SCALE}p"; then
                  NOTE="مستر ${MB} مگی: https://github.com/$OWNER/motion-assets/releases/tag/$TAG"
                else
                  NOTE="آپلود مستر روی گیت‌هاب ناموفق بود (دسترسی توکن رو چک کن)."
                fi
              fi
              NL=$'\n'
              tg_video /tmp/preview.mp4 "پیش‌نمایش ✅ (${DUR} ثانیه · crf ${C})${NL}${NOTE}"
              ;;
            split)
              mkdir -p /tmp/parts && cd /tmp/parts
              7z a -v45m -mx0 "${EP}.7z" /tmp/master.mp4 > /dev/null
              N=$(ls "${EP}".7z.* | wc -l)
              tg_msg "ویدیو (${MB} مگ) به ${N} تکه‌ی ۴۵ مگی تقسیم شد. همه رو توی یه پوشه بریز و با ZArchiver یا 7-Zip فایل .001 رو باز کن تا ویدیوی کامل بیرون بیاد."
              for f in $(ls "${EP}".7z.* | sort); do
                curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" -F chat_id="$CHAT" -F document=@"$f" -F caption="$f" > /dev/null
              done
              ;;
          esac

  notify-failure:
    needs: [plan, shard, finish]
    if: ${{ always() && (needs.plan.result == 'failure' || needs.shard.result == 'failure' || needs.finish.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Tell me on Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT" \
            --data-urlencode "text=❌ رندر مرد گچی خطا خورد. لاگ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
